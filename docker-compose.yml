version: "3.9"

services:
  app:
    image: plamer88/indie-game-radar:latest
    container_name: indie_game_app
    restart: unless-stopped

    network_mode: "host"

    ports:
      - "8000:8000"

    env_file:
      - .env

    # Mount the directory containing the Telethon session file
    volumes:
      - /home/indie_game_radar/tg_sessions/forwarder_prod_session.session:/app/forwarder_prod_session.session

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
